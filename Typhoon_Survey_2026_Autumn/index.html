<!doctype html><html lang=ja><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>自由記述の絞り込み</title><style>
:root{--fg:#1d2430;--mut:#5b6575;--line:#d9dee7;--ac:#1f5fae;--bg:#fff;--soft:#f3f6fb}
@media (prefers-color-scheme:dark){:root{--fg:#e6e9ef;--mut:#9aa5b5;--line:#313a48;--ac:#7db3f0;--bg:#14181f;--soft:#1c222c}}
@media print{:root{--fg:#1d2430;--mut:#5b6575;--line:#d9dee7;--ac:#1f5fae;--bg:#fff;--soft:#f3f6fb}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:'Noto Sans CJK JP','IPAPGothic',sans-serif;font-size:10.5pt;line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
h1{font-size:19pt;line-height:1.4;margin:0 0 4px}h2{font-size:13pt;border-left:5px solid var(--ac);padding-left:8px;margin:22px 0 8px}h3{font-size:11pt;margin:16px 0 4px}h3 small{font-weight:400;color:var(--mut);margin-left:6px}
table{width:100%;border-collapse:collapse;margin:2px 0}td,th{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:middle}th{background:var(--soft);font-weight:600;font-size:9.5pt}
td.n{width:48px;text-align:right;font-variant-numeric:tabular-nums}td.bar{width:34%}td.bar i{display:block;height:9px;background:var(--ac);border-radius:2px}
.note,.meta{color:var(--mut);font-size:9pt;margin:3px 0}.key{background:var(--soft);padding:10px 14px 10px 30px;border-radius:6px}.key li{margin:3px 0}
.box{border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:var(--soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}.avoid{break-inside:avoid}

body{font-size:15px}.wrap{padding:16px}.bar2{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}select,input[type=search]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.chips button{font:inherit;font-size:13px;border:1px solid var(--ac);color:var(--ac);background:transparent;border-radius:14px;padding:3px 10px;margin:3px 4px 0 0;cursor:pointer}.chips button.on{background:var(--ac);color:var(--bg)}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:10px 0}.sel{color:var(--mut);font-size:13px}.t{white-space:pre-wrap;margin:6px 0}.chip{display:inline-block;font-size:12px;border:1px solid var(--ac);color:var(--ac);border-radius:10px;padding:0 8px;margin:2px 4px 0 0}.chip.off{border-color:var(--mut);color:var(--mut)}
a{color:var(--ac)}</style>
<body><div class=wrap>
<h1 style="font-size:22px">自由記述の絞り込み</h1>
<p class=meta>台風・大雨による非正規雇用 休業・給与実態アンケート(2026年秋)。原文のまま収録、分類は管理人が付与。</p>
<p><a href="summary.pdf">概要版PDF(集計結果のまとめ)</a> / <a href="full.pdf">自由記述 全文版PDF</a></p>
<div class=chips id=cats></div>
<div class=bar2><select id=emp><option value="">就業形態:すべて</option></select><select id=reg><option value="">地域:すべて</option></select>
<input type=search id=q placeholder="キーワード" style="flex:1;min-width:160px"><label><input type=checkbox id=out> 対象外も表示</label></div>
<p class=meta id=cnt></p><div id=list></div></div>
<script>
const D={"cats": {"1": "在宅可否の格差", "2": "遅刻・早退の無給", "3": "有給の消化", "4": "相談先の機能不全", "5": "情報が届かない", "6": "安全・帰宅困難のリスク", "7": "救済・配慮の事例", "8": "過去の大規模災害", "9": "対象外(台風・大雨以外)"}, "entries": [{"id": "F-01", "emp": "派遣社員", "region": "東海", "reason": "交通機関の途絶", "pay": "1〜3割程度", "kyugyo": "支払われなかった", "explain": "「天災だから」等、簡単な説明のみ", "text": "今回(2026/9/8)の台風は定時まで働いたら公共交通機関が止まりそうだったため、自主的に早退しました。会社から促された訳ではないので、早退した時間分給料が減ります。定時まで仕事をした場合は全ての公共交通機関が止まっていたので、ホテルを予約するか、暑い中駅で延々と待つはめになったと思います。前者は金銭的負担、後者は体力的な負担になります。いずれにせよこれよりましだと思って早退しました。休業補償などはありません。毎回、大雨や台風の時はこのような状態となり給料は減ることになります。過去に1社だけ定時まで勤怠を付けて午後から早退するようにと指示を出して貰えた会社がありましたが、相当稀なことです。基本的に補償は無いので、晩夏から秋までの台風の時は毎回冷や冷やします。最近は派遣のみ在宅不可の案件が多く、悪天候で在宅勤務に切り替えることも出来ません。長くなってしまい、申し訳ありません。", "cats": [1, 2, 6, 7], "scope": "対象", "note": ""}, {"id": "F-02", "emp": "派遣社員", "region": "関東", "reason": "出社できなかったことはなし", "pay": "", "kyugyo": "", "explain": "", "text": "台風の時、正社員は在宅できるけど、派遣は休んでくださいとだけ。\n勤務開始から半年経ってなければ普通に減給。", "cats": [1], "scope": "対象", "note": ""}, {"id": "F-03", "emp": "派遣社員", "region": "東海", "reason": "出社できなかったことはなし", "pay": "", "kyugyo": "", "explain": "", "text": "今の派遣先ではなくて、別の派遣先での就業の時、台風の影響でスタッフや指揮命令者が帰宅することになった。\n残りたければ残っていいし、帰りたければ帰ってもいいと言われました。派遣会社へ相談をしましたが、ノーワークノーペイの原則なので。ということで終わりました。\n", "cats": [4], "scope": "対象", "note": ""}, {"id": "F-04", "emp": "派遣社員", "region": "関東", "reason": "事業所被災", "pay": "3〜5割程度", "kyugyo": "支払われた", "explain": "「天災だから」等、簡単な説明のみ", "text": "東日本大震災の時は6割は出ましたが、その後すぐに解雇されました。\n台風の時に出社時間を遅らせるなどもありましたが、その時は遅れは遅刻と見なされ時給は発生しませんでした。正社員はフレックス扱いです。", "cats": [1, 2, 8], "scope": "対象", "note": ""}, {"id": "F-05", "emp": "派遣社員", "region": "関東", "reason": "出社できなかったことはなし", "pay": "", "kyugyo": "", "explain": "", "text": "今回、私は通勤できましたが、通勤不能の場合は有給休暇を使えと言われています。", "cats": [3], "scope": "対象", "note": ""}, {"id": "F-06", "emp": "パート・アルバイト", "region": "九州", "reason": "その他", "pay": "わからない", "kyugyo": "有給休暇等で全額支払われた", "explain": "説明が一切なかった", "text": "自家用車での通勤。風雨が強いと自宅待機となる。", "cats": [], "scope": "対象", "note": ""}, {"id": "F-07", "emp": "派遣社員", "region": "関東", "reason": "両方", "pay": "1〜3割程度", "kyugyo": "支払われなかった", "explain": "説明が一切なかった", "text": "コロナですが部内にコロナ出たら派遣社員残して正社員全員家に帰った　何も告知なく", "cats": [9], "scope": "対象外", "note": "コロナ"}, {"id": "F-08", "emp": "派遣社員", "region": "近畿", "reason": "交通機関の途絶", "pay": "減っていない(有給扱い等)", "kyugyo": "支払われなかった", "explain": "説明が一切なかった", "text": "大雪で電車遅延が確定していたが、派遣元営業より、こちらが連絡する前にメールで、「明日は電車遅延が予想されるので２時間早い電車に乗る等の対応をするように」と連絡が来た。\n始発で出社し、なんとか定時に間に合ったが、社員は在宅に切り替えていた。社員から、派遣さんたちも在宅に切り替えれば良かったのにと言われた。", "cats": [9], "scope": "対象外", "note": "大雪"}, {"id": "F-09", "emp": "派遣社員", "region": "九州", "reason": "交通機関の途絶", "pay": "減っていない(有給扱い等)", "kyugyo": "有給休暇等で全額支払われた", "explain": "詳しい説明があった", "text": "台風の日は、通勤に利用している公共交通機関が午前11時時点で止まっていたら出社しなくてよい、というルールで、実際に出社しなかった日がありました。勤怠は定時で勤務したこととし、有給は使わなくてよい、との説明を受けました。リモートワークができない部署なので、休みと同じ状態で1日分の給与が出ました。", "cats": [7], "scope": "対象", "note": ""}, {"id": "F-10", "emp": "パート・アルバイト", "region": "不明", "reason": "出社できなかったことはなし", "pay": "", "kyugyo": "", "explain": "", "text": "豪雪時はなんとか歩いて行けるけど水害時は行けないよね。社員は、普段車で30分の道程を半日かかっても何が何でも命懸けで絶対出勤しなきゃいけないから大変だなぁと思った。", "cats": [6], "scope": "対象", "note": ""}, {"id": "F-11", "emp": "派遣社員", "region": "関東", "reason": "出社できなかったことはなし", "pay": "", "kyugyo": "", "explain": "", "text": "日曜夜に派遣先は社員宛に月曜朝は無理せずに安全第一でリモート可ならそうしてなどの通知があったが、派遣はリモートなし、持ち帰れるpcの貸与なしで、このメールは見れません。派遣元からもなにもなし。ふざけんなと思う。", "cats": [1, 5], "scope": "対象", "note": ""}, {"id": "F-12", "emp": "派遣社員", "region": "東海", "reason": "出社できなかったことはなし", "pay": "", "kyugyo": "", "explain": "", "text": "早退しましたが、その分は無給でした。同じ部署の正社員や長く勤務している派遣の人は在宅勤務が許されているので出社せず、在宅が許可されてない派遣は出社していました。\n他の部署の正社員はみんな出社していました。私の部署の正社員だけが何か違ったようです。\n", "cats": [1, 2], "scope": "対象", "note": ""}, {"id": "F-13", "emp": "派遣社員", "region": "関東", "reason": "両方", "pay": "1〜3割程度", "kyugyo": "支払われた", "explain": "「天災だから」等、簡単な説明のみ", "text": "東日本大震災の時は6割負担でした。2週間ほど出社できず。ただ後に復旧したあとに出社できなかった人（ガソリンがない、ライフラインが復旧していない等）は有休や退職になりました。\n台風の時は時間を遅らせ出社になりましたが補填などはありませんでした。正社員はフレックスで対応でした。", "cats": [1, 2, 3, 8], "scope": "対象", "note": ""}, {"id": "F-14", "emp": "派遣社員", "region": "関東", "reason": "その他", "pay": "減っていない(有給扱い等)", "kyugyo": "有給休暇等で全額支払われた", "explain": "「天災だから」等、簡単な説明のみ", "text": "所属していた派遣先部署で派遣は自分だけだったのと、過去に派遣社員に対してのそういった事例がなかった様で、出社に関して派遣本人の判断に委ねられた。\n正規社員は原則、全員在宅勤務を命じられていたが、リモート不可の派遣社員が出社してしまうと社員誰かしら出社しなければならずかえってご迷惑をかけてしまうと思い、1日有休にしました。", "cats": [1, 3], "scope": "対象", "note": ""}, {"id": "F-15", "emp": "派遣社員", "region": "関東", "reason": "交通機関の途絶", "pay": "減っていない(有給扱い等)", "kyugyo": "支払われなかった", "explain": "説明が一切なかった", "text": "以前行っていた派遣先で大雪の日に、行きは問題なかったが、定時まで勤務すると交通が途絶しそうだった。\n正社員のほとんどと契約社員は最初から休み。\n派遣と管理者の正社員（天候に合わせて徒歩で通勤できる人が来ていた）のみで定時までいるよう言われたが、定時までいると帰宅できなくなるのがほぼ確定だったので半休をとって（上長からはOKが出た、というよりむしろ帰った方がいいと言ってくれた）帰宅した。\n多くの派遣も同じようにしていた。\n後日更新時に「指示がないのに勝手に帰宅されたら困るのでこういうことはやめてほしい」と派遣先から注意があったらしいが、その時は派遣元の担当営業が「いくら何でもそれは無理」と言ってくれて更新継続になった。\nなお、残った派遣で一部帰宅困難になった人もいたが、謝罪も補償もなかったとのことで、それを理由に辞めた人も複数いた。\n基本、現場はいい人が大多数で派遣のことも心配してくれたが、上の人間は派遣を人と思っていなさそうで不信感を覚えた。", "cats": [9], "scope": "対象外", "note": "大雪"}, {"id": "F-16", "emp": "派遣社員", "region": "関東", "reason": "その他", "pay": "3〜5割程度", "kyugyo": "支払われなかった", "explain": "「天災だから」等、簡単な説明のみ", "text": "現在就業している派遣先はノーワークノーペイ。　正社員は台風の際は在宅。　意地でも出社しないとお給料が減ります… 中小企業だとお給料出してくれてお休みにしてくれる会社が多い気がします。", "cats": [1], "scope": "対象", "note": ""}]};const $=s=>document.querySelector(s);let sel=new Set();
const uniq=a=>[...new Set(a)];
uniq(D.entries.map(e=>e.emp)).forEach(v=>$('#emp').add(new Option(v,v)));
uniq(D.entries.map(e=>e.region)).forEach(v=>$('#reg').add(new Option(v,v)));
for(const[k,v]of Object.entries(D.cats)){const b=document.createElement('button');b.textContent=k+'. '+v;b.onclick=()=>{sel.has(+k)?sel.delete(+k):sel.add(+k);b.classList.toggle('on');draw()};$('#cats').append(b)}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function draw(){const q=$('#q').value.trim();const r=D.entries.filter(e=>($('#out').checked||e.scope==='対象')&&(!$('#emp').value||e.emp===$('#emp').value)&&(!$('#reg').value||e.region===$('#reg').value)&&(!sel.size||e.cats.some(c=>sel.has(c)))&&(!q||e.text.includes(q)));
$('#cnt').textContent=r.length+'件を表示(全'+D.entries.length+'件)';
$('#list').innerHTML=r.map(e=>`<div class=card><div><b>${e.id}</b> ${esc(e.emp)}/${esc(e.region)}/${esc(e.reason)} ${e.scope==='対象外'?`<span class="chip off">対象外(${esc(e.note)})</span>`:''}</div>${(e.pay||e.kyugyo)?`<div class=sel>給料の減り方:${esc(e.pay||'未回答')} ・ 休業手当:${esc(e.kyugyo)} ・ 会社の説明:${esc(e.explain)}</div>`:''}<div class=t>${esc(e.text)}</div><div>${e.cats.map(c=>`<span class=chip>${c}. ${esc(D.cats[c])}</span>`).join('')||'<span class="chip off">分類なし</span>'}</div></div>`).join('')}
['#emp','#reg','#out'].forEach(s=>$(s).onchange=draw);$('#q').oninput=draw;draw();
</script></body></html>
